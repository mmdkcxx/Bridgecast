# Builds the unsigned macOS disks (Intel and Apple silicon) and attaches them to the GitHub
# release. Runs when a release is published, or by hand for an existing tag.
# macOS builds do not self-update and are not notarized: Gatekeeper blocks the first open.
name: macOS build

on:
  # Test builds: a push to this branch builds the disks and keeps them as a workflow artifact.
  push:
    branches: [test/mac-build]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (for example v0.1.14). Empty = test build, kept as a workflow artifact
        required: false
      ref:
        description: Commit or branch to build from (defaults to the tag)
        required: false

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || env.TAG || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        # Ad-hoc signed (mac.identity '-' in electron-builder.yml): no Apple certificate yet.
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never
      - name: Verify the signature
        run: |
          for app in dist/mac*/Bridgecast.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Signature|flags'
          done
      - name: Keep the test build as a workflow artifact
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: bridgecast-mac-dmg
          path: dist/*.dmg
          retention-days: 14
      - name: Attach to the release
        if: env.TAG != ''
        run: gh release upload "$TAG" dist/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
