appId: com.bridgecast.app
productName: Bridgecast
publish:
  provider: github
  owner: CallMeSon
  repo: Bridgecast
directories:
  buildResources: build
# Allowlist: only the built app (out/) and package.json; production
# dependencies are added by electron-builder. Fixtures, e2e, docs and local
# test decks never end up in the installer.
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
  - node_modules/koffi/**
  - node_modules/@koromix/**
win:
  executableName: Bridgecast
  extraResources:
    - from: scripts/export-pptx.ps1
      to: scripts/export-pptx.ps1
    - from: resources/omt/win
      to: omt
    # PowerPoint slide show helper; build it first: scripts/build-ppt-bridge.sh (npm run build:bridge)
    - from: native/ppt-bridge/bin/Release/net48
      to: ppt-bridge
      filter:
        - ppt-bridge.exe
        - ppt-bridge.exe.config
    # WebView2 page helper; build it first: npm run build:web-bridge (or build:web-bridge:win)
    # (the WebView2 managed and native loader DLLs must travel with the exe)
    - from: native/web-bridge/bin/Release/net48
      to: web-bridge
      filter:
        - web-bridge.exe
        - web-bridge.exe.config
        - Microsoft.Web.WebView2.Core.dll
        - WebView2Loader.dll
        - runtimes/**
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  include: build/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Ad-hoc signature (no Apple certificate yet). An unsigned build is reported as
  # "damaged" on Apple silicon; ad-hoc gets the normal "cannot verify" prompt instead.
  identity: '-'
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    # PowerPoint for Mac slide show helper; built in CI: scripts/build-mac-ppt-bridge.sh
    - from: native/mac-ppt-bridge/dist
      to: mac-ppt-bridge
      filter:
        - mac-ppt-bridge
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - NSAppleEventsUsageDescription: Bridgecast uses Microsoft PowerPoint or Keynote to convert PowerPoint files to PDF when you import them.
  notarize: false
dmg:
  # One disk per architecture: the arch keeps the Intel and Apple silicon files apart.
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  extraResources:
    - from: resources/omt/linux
      to: omt
    # LibreOffice slide show / import helper (python3 + python3-uno on the target PC)
    - from: native/lo-bridge
      to: lo-bridge
      filter:
        - bridge.py
        - steps.py
  target:
    - AppImage
    - deb
deb:
  recommends:
    - libreoffice-impress
    - python3-uno
    - gstreamer1.0-plugins-good
    - gstreamer1.0-libav
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
